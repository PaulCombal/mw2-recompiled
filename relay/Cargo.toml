[package]
name = "mw2-relay"
version = "0.0.0"
edition = "2024"
publish = false
description = "The server players choose with the launcher's NETWORK SERVER"

[dependencies]
getrandom = "0.3"
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }
siphasher = "1"
time = "0.3"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
