# The launcher (launcher/): what a player opens, mw2-launcher. It is Rust: its window, its
# compile pass, on the shaders crate the game builds its shaders with (shaders/), its
# install, on the crate the game reads its executable with (install/), and its custom
# maps, on the map converter (mapport/). cargo xtask build makes it, in the build folder it
# configured (build.rs); it is not the workspace's default member, so a plain cargo build
# makes the game alone.
[package]
name = "mw2-launcher"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

# What the self-update reads in a release's description (src/release.rs), apart so that
# cargo test runs its tests: the binary's main is the C runtime's, which no test harness
# replaces.
[lib]
path = "src/release.rs"
doctest = false

[[bin]]
name = "mw2-launcher"
path = "src/main.rs"
test = false

[features]
default = ["diagnostics"]
# On Windows, the console window a terminal run prints to.
diagnostics = []
# A player's build, which cargo xtask build --release asks for: the launcher links no C++
# library, so it is the same build as without.
portable = []

[dependencies]
# SDL, the game's (sdl3-sys builds it, cmake/sdl.cmake).
sdl3-sys = { version = "=0.7.2", default-features = false, features = ["build-from-source-static"] }
ash = { version = "=0.38.0", default-features = false, features = ["std", "linked"] }
mw2-shaders = { path = "../shaders" }
# The game's XMA frame decoder, for the menu sounds (src/sound.rs).
wmapro = { path = "../wmapro" }
# The disc, the update's package and the executables, read as the game and cargo xtask
# read them (install/).
mw2-install = { path = "../install" }
# The font rasteriser the game's system screens use, for the window's text (src/atlas.rs).
mw2-truetype = { path = "../truetype" }
# The game's fastfiles read as its loader streams them, for the shaders the compile pass
# builds (src/precompile.rs).
mw2-zone = { path = "../zone" }
# The map converter, for the maps screen (src/maps.rs).
mw2-mapport = { path = "../mapport" }

[build-dependencies]
# The SHA-256 build.rs hashes the executables and the update's fastfiles the install
# checks with.
mw2-install = { path = "../install" }
