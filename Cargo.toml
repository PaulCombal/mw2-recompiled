# The game: cargo links the executable from the guest code (generated/, which
# cargo xtask writes), the runtime and the shader code it shares with the launcher
# (shaders/), and with diagnostics the C++ build.rs compiles. A plain build takes
# the title cargo xtask last generated:
#
#   cargo xtask build --title mp    generates, builds, and is the usual way
#   cargo build --release           again, once generated/ is there
[package]
name = "mw2"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "mw2"
path = "src/main.rs"

[features]
default = ["diagnostics"]
# The traces, dumps, statistics and test harness (runtime/diagnostics.h).
diagnostics = []
# The C++ standard library linked in, for a binary that runs on other machines:
# the game has C++ only with diagnostics.
portable = []

[dependencies]
ppc_recomp = { path = "generated/ppc_recomp" }
ppc_rt = { path = "generated/ppc_rt" }
# SDL, built from its source (the sdl3-src crate, the version named in its own) and
# linked statically: cmake/sdl.cmake says how.
sdl3-sys = { version = "=0.7.2", default-features = false, features = ["build-from-source-static"] }
# Vulkan for the renderer: the loader linked by name, not loaded at run time (its
# default "loaded" would bring libloading).
ash = { version = "=0.38.0", default-features = false, features = ["std", "linked"] }
# The shader translator, the device, the pipeline layout and the shader build the
# launcher shares (shaders/).
mw2-shaders = { path = "shaders" }
# The XMA frame decoder, which the launcher shares (wmapro/).
wmapro = { path = "wmapro" }
# The executable's image and its SHA-256, which the launcher and cargo xtask share
# (install/).
mw2-install = { path = "install" }

[build-dependencies]
# The SHA-256 build.rs hashes the image the game was recompiled from with.
mw2-install = { path = "install" }

[workspace]
members = ["install", "launcher", "shaders", "wmapro"]
# Each of these is a workspace of its own.
exclude = ["generated", "relay", "xtask"]

# The generated workspace's own settings: only the top workspace's count.
[profile.release]
opt-level = 3
codegen-units = 1
incremental = false
debug = false
panic = "abort"

# The install crate optimised in the build scripts too, which hash the executables and
# the update's fastfiles with it (build.rs, launcher/build.rs): a build script and its
# dependencies are otherwise compiled unoptimised, where 128 MB take 4 s to hash at
# every run, and the launcher's runs again at any change to its sources. A package's own
# settings come before build-override's.
[profile.release.package.mw2-install]
opt-level = 3

# cargo build: this crate's checks on, and the guest code as in a release, which
# would overflow the host's stack unoptimised, and needs its wrapping arithmetic
# unchecked. build.rs compiles the diagnostics C++ at -O3 either way.
[profile.dev]
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
