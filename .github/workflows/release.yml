# Builds the player's release and drafts a GitHub Release with it. Run by hand
# from the Actions tab.
#
# The recompiled code is made from the disc's two executables and, for title
# update 6, the update's patches to them, none of which are in this repository.
# They come from a private one, as Unleashed Recompiled does it: the secret
# ASSET_REPO names it (owner/name), ASSET_REPO_TOKEN is a token that can read
# it, and it holds default.xex and default_mp.xex at its root and the update's
# files (two .xexp, three .ff) under title-updates/TU6/.
#
# The relay players choose with NETWORK SERVER (relay/) is built from this
# repository alone: its image goes to the GitHub Container Registry under the
# release's tag, and its Linux binary into the release.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  linux:
    # The oldest supported runner, so the binaries ask for glibc 2.35 at most.
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6

      - name: Check out the game's executables
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.ASSET_REPO }}
          token: ${{ secrets.ASSET_REPO_TOKEN }}
          path: private

      - name: Place them
        run: |
          mkdir -p mw2/tu0 mw2/update
          cp private/default.xex private/default_mp.xex mw2/tu0/
          cp private/title-updates/TU6/*.xexp private/title-updates/TU6/*.ff mw2/update/
          rm -rf private

      - name: Install the toolchain and libraries
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 18
          # Clang builds against the newest libstdc++ it finds, and 22.04's is
          # GCC 12's. The toolchain PPA's GCC 13 one is what the runtime is
          # built with elsewhere; a release links it statically (MW2_PORTABLE),
          # so the binary still asks for nothing past glibc 2.35.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          # SDL3's video, audio, input and dialog backends, and the Vulkan loader.
          sudo apt-get update
          sudo apt-get install -y libstdc++-13-dev ninja-build ccache pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libvulkan-dev
          # Ubuntu 22.04's Vulkan headers predate extensions the renderer asks for.
          git clone -q --depth 1 --branch v1.3.275 https://github.com/KhronosGroup/Vulkan-Headers.git
          cmake -S Vulkan-Headers -B Vulkan-Headers/build -G Ninja
          sudo cmake --install Vulkan-Headers/build
          rm -rf Vulkan-Headers llvm.sh

      - name: Restore the compiler cache
        uses: actions/cache@v5
        with:
          # ThinLTO's results beside the compiler's (MW2_LTO_CACHE).
          path: |
            .ccache
            .lto-cache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build
        run: |
          export CMAKE_EXTRA="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DFETCHCONTENT_BASE_DIR=$PWD/out/_deps -DMW2_LTO_CACHE=$PWD/.lto-cache"
          # The launcher is the same for both titles, and the tools are not shipped:
          # the campaign's build makes the game and the launcher, the multiplayer's the game.
          for title in sp mp; do
            targets="mw2"; [ $title = sp ] && targets="mw2 launcher"
            TITLE=$title RELEASE=1 RELEASE_TAG=${{ inputs.version }} BUILD_DIR=out/$title TARGETS="$targets" ./build.sh
          done
          ccache --show-stats

      - name: Package
        run: |
          mkdir -p dist
          name=mw2-${{ inputs.version }}-linux
          mkdir -p $name
          cp out/sp/mw2 $name/mw2-sp
          cp out/mp/mw2 $name/mw2-mp
          cp out/sp/mw2-launcher $name/mw2-launcher
          strip $name/mw2-sp $name/mw2-mp $name/mw2-launcher
          cp README.md LICENSE $name/
          cp third_party/fonts/OFL.txt $name/FONT-LICENSE.txt
          tar czf dist/$name.tar.gz $name
          # Launchers up to v0.7.x look for the archive of their own online
          # service; the same archive under both names updates them.
          for online in steam lan; do cp dist/$name.tar.gz dist/$name-$online.tar.gz; done
          echo "glibc needed: $(objdump -T out/mp/mw2 | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/*

  windows:
    # Cross-compiled on Linux with llvm-mingw: the same compiler family and the
    # same build as Linux, and the compiler cache of a Linux runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPILERCHECK: content
      LLVM_MINGW_RELEASE: "20260922"
    steps:
      - uses: actions/checkout@v6

      - name: Check out the game's executables
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.ASSET_REPO }}
          token: ${{ secrets.ASSET_REPO_TOKEN }}
          path: private

      - name: Place them
        run: |
          mkdir -p mw2/tu0 mw2/update
          cp private/default.xex private/default_mp.xex mw2/tu0/
          cp private/title-updates/TU6/*.xexp private/title-updates/TU6/*.ff mw2/update/
          rm -rf private

      - name: Install the toolchains
        run: |
          sudo apt-get update
          # clang-18 builds XenonRecomp, which runs here; llvm-mingw builds the game.
          sudo apt-get install -y clang-18 lld-18 ninja-build ccache zip
          name=llvm-mingw-$LLVM_MINGW_RELEASE-ucrt-ubuntu-22.04-x86_64
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_RELEASE/$name.tar.xz
          tar xf $name.tar.xz -C $HOME && rm $name.tar.xz
          echo "LLVM_MINGW=$HOME/$name" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache@v5
        with:
          # ThinLTO's results beside the compiler's (MW2_LTO_CACHE).
          path: |
            .ccache
            .lto-cache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Build
        run: |
          export CMAKE_EXTRA="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DFETCHCONTENT_BASE_DIR=$PWD/out/_deps -DMW2_LTO_CACHE=$PWD/.lto-cache"
          # The launcher is the same for both titles, and the tools are not shipped:
          # the campaign's build makes the game and the launcher, the multiplayer's the game.
          for title in sp mp; do
            targets="mw2"; [ $title = sp ] && targets="mw2 launcher"
            WINDOWS=1 TITLE=$title RELEASE=1 RELEASE_TAG=${{ inputs.version }} BUILD_DIR=out/$title TARGETS="$targets" ./build.sh
          done
          ccache --show-stats

      - name: Package
        run: |
          mkdir -p dist
          name=mw2-${{ inputs.version }}-windows
          mkdir -p $name
          cp out/sp/mw2.exe $name/mw2-sp.exe
          cp out/mp/mw2.exe $name/mw2-mp.exe
          cp out/sp/mw2-launcher.exe $name/mw2-launcher.exe
          $LLVM_MINGW/bin/llvm-strip $name/mw2-sp.exe $name/mw2-mp.exe $name/mw2-launcher.exe
          cp README.md LICENSE $name/
          cp third_party/fonts/OFL.txt $name/FONT-LICENSE.txt
          zip -qr dist/$name.zip $name
          # Launchers up to v0.7.x look for the archive of their own online
          # service; the same archive under both names updates them.
          for online in steam lan; do cp dist/$name.zip dist/$name-$online.zip; done
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: dist/*

  relay:
    # The image for amd64 and arm64, the second built under emulation, and the
    # amd64 binary out of it for the release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/mw2-relay:${{ inputs.version }}
          docker buildx build relay/ --platform linux/amd64,linux/arm64 --push --tag $image \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          mkdir -p dist
          docker buildx build relay/ --platform linux/amd64 --output type=local,dest=binary
          cp binary/mw2-relay dist/mw2-relay-${{ inputs.version }}-linux-x86_64
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: release-relay
          path: dist/*

  release:
    needs: [linux, windows, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          # The release's files, not the other artifacts of the run.
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bullets are placeholders: the draft is edited before it is
          # published, to say what the release brings.
          cat > notes.md <<'EOF'
          This release includes:
          - NEW:
          - Fixed:
          - Built on ${{ github.sha }}

          Needs your own copy of the game: an ISO of the Xbox 360 disc, version 1.0.557.
          Take `linux` or `windows` (the `-steam` and `-lan` copies are the same file, for launchers of v0.7.x to update themselves).
          Extract it anywhere and start `mw2-launcher`: it installs the game from your ISO, then starts it.
          EOF
          gh release create "${{ inputs.version }}" dist/* --repo "${{ github.repository }}" \
            --draft --title "${{ inputs.version }}" --notes-file notes.md --target "${{ github.sha }}"
