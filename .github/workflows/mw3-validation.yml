name: MW3 validation

on:
  push:
    branches:
      - mw3-bringup
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "config/MW3.toml"
      - "tools/**"
      - "runtime/**"
      - ".github/workflows/mw3-validation.yml"
      - "docs/MW3-BUILD.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check shell syntax
        run: bash -n tools/build_mw3.sh tools/recomp_mw3.sh

      - name: Compile-check Python tooling
        run: |
          python -m compileall -q tools
          python tools/audit_mw3_startup.py --self-test
          python tools/audit_mw3_dpc.py --self-test
          python tools/audit_mw3_xex_module_handle.py --self-test

      - name: Test MW2-to-MW3 hook matcher
        run: python tools/port_hooks.py --selftest

      - name: Validate MW3 recompiler configuration and title routing
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import tomllib

          with open("config/MW3.toml", "rb") as f:
              config = tomllib.load(f)

          main = config["main"]
          assert main["file_path"] == "../mw3/tu0/default.xex"
          assert main["out_directory_path"] == "../ppc_mw3"
          assert main["switch_table_file_path"] == "mw3_switch_tables.toml"
          functions = config.get("functions", [])
          addresses = [fn["address"] for fn in functions]
          assert len(addresses) == len(set(addresses)), "duplicate MW3 function entries"
          assert all(fn["size"] > 0 for fn in functions)

          os.environ["MW2_TITLE"] = "mw3"
          os.environ["MW2_VERSION"] = "tu0"
          spec = importlib.util.spec_from_file_location("title", "tools/title.py")
          title = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(title)
          assert title.NAME == "mw3"
          assert title.XEX.endswith("mw3/tu0/default.xex")
          assert title.PPC.endswith("ppc_mw3")
          assert title.TOML.endswith("config/MW3.toml")
          print(f"Validated MW3 config: {len(functions)} explicit function extents")
          PY

      - name: Ensure MW3 cannot accidentally link against MW2 runtime
        run: |
          set +e
          output=$(cmake -S . -B /tmp/mw3-runtime-guard -DMW2_TITLE=mw3 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "CMake unexpectedly accepted the incomplete MW3 runtime configuration."
            exit 1
          fi
          echo "$output"
          grep -F "MW3 runtime integration is incomplete" <<< "$output"


  generated-code-build:
    # Configure this repository variable and secret to enable a real MW3 XEX build.
    if: ${{ vars.MW3_ASSET_REPO != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check out private MW3 executable
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.MW3_ASSET_REPO }}
          token: ${{ secrets.MW3_ASSET_REPO_TOKEN }}
          path: private

      - name: Verify and stage the exact supported executable
        run: |
          set -euo pipefail
          test -f private/default.xex || { echo "Private asset repository must contain default.xex at its root"; exit 1; }
          actual=$(sha256sum private/default.xex | cut -d' ' -f1)
          expected=d90bc8d93b7b8f6001ead8330271196a6ef7a5c2e4a9e9b63118f47d58a05912
          echo "MW3 XEX SHA-256: $actual"
          test "$actual" = "$expected" || { echo "Unexpected MW3 executable; refusing to build against an unverified image"; exit 1; }
          echo "Private XEX/fastfile inventory (names and sizes only):"
          find private -type f \( -iname '*.xex' -o -iname '*.ff' -o -iname '*.ffm' \) -printf '%P %s bytes\n' | sort | head -n 200
          mkdir -p mw3/tu0
          # Preserve the complete extracted game-root layout (fastfiles, subfolders,
          # and any additional XEX files) while excluding checkout metadata.
          find private -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} mw3/tu0/ \;
          test -f mw3/tu0/default.xex
          rm -rf private

      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 ninja-build python3 cmake git binutils libvulkan-dev

      - name: Recompile MW3 and compile generated PPC
        run: bash tools/build_mw3.sh --compile-only

      - name: Link MW3 diagnostic desktop executable
        run: |
          cmake -S . -B build-mw3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DMW2_TITLE=mw3 \
            -DMW3_RECOMP_ONLY=ON \
            -DMW3_LINK_PROBE=ON \
            -DMW2_USE_SDL=OFF \
            -DMW2_LTO=OFF
          cmake --build build-mw3 --target mw2 --parallel

      - name: Smoke-test MW3 runtime with the private XEX
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mw3-runtime-smoke.log"
          set +e
          timeout --signal=TERM --kill-after=5s 35s env \
            MW2_RUN_SECONDS=12 \
            MW2_LOG_FILE="$log" \
            ./build-mw3/mw3 mw3/tu0/default.xex mw3/tu0
          status=$?
          set -e
          if [ -f "$log" ]; then
            echo "----- MW3 runtime smoke log -----"
            tail -n 160 "$log"
            echo "----- end runtime smoke log -----"
          else
            echo "Runtime did not create its diagnostic log."
          fi
          grep -F "function table:" "$log"
          grep -F "entering guest at" "$log"
          grep -F "XamLoaderLaunchTitle: default.xex" "$log"
          grep -F "exiting: the title started its other executable" "$log"
          grep -F "the title asked for default.xex: start that build yourself" "$log"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "Expected the development runner to exit normally or with its explicit handoff status; got $status"
            exit 1
          fi
          echo "MW3 first-stage startup and explicit next-title handoff were reached."

      - name: Upload generated PPC inputs for isolated audits
        uses: actions/upload-artifact@v4
        with:
          name: mw3-generated-audit-inputs
          path: |
            build-mw3/libppc_recomp.a
            ppc_mw3/ppc_recomp.*.cpp
            ppc_mw3/ppc_func_mapping.cpp
            ppc_mw3/kernel_imports.txt
          if-no-files-found: error
          retention-days: 2

  generated-code-audit:
    needs: generated-code-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download generated PPC audit inputs
        uses: actions/download-artifact@v4
        with:
          name: mw3-generated-audit-inputs

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 binutils

      - name: Run isolated MW3 metadata audits
        run: |
          set -euo pipefail
          python3 tools/audit_mw3_generated.py build-mw3/libppc_recomp.a build-mw3/mw3-runtime-audit.txt
          python3 tools/audit_mw3_startup.py --report build-mw3/mw3-startup-callgraph.txt
          python3 tools/audit_mw3_dpc.py --report build-mw3/mw3-dpc-callsites.txt
          python3 tools/audit_mw3_xex_module_handle.py --source-dir ppc_mw3 | tee build-mw3/mw3-xex-module-handle-audit.txt

      - name: Upload MW3 runtime audit metadata
        uses: actions/upload-artifact@v4
        with:
          name: mw3-runtime-audit-metadata
          path: |
            build-mw3/mw3-runtime-audit.txt
            build-mw3/mw3-startup-callgraph.txt
            build-mw3/mw3-dpc-callsites.txt
            build-mw3/mw3-xex-module-handle-audit.txt
            ppc_mw3/kernel_imports.txt
          if-no-files-found: error
          retention-days: 14
